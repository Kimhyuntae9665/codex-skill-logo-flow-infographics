" stroke="#8793a8" stroke-width="1.5"/><image x="608.0" y="88.0" width="64.0" height="64.0" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/><text x="640" y="194" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="500" fill="#d2daea">SQLite</text></g><text x="400.0" y="255" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#d2daea">Proposed example / no deployed architecture</text></svg>