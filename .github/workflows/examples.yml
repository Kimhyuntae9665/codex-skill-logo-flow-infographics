name: Verify example graphs
on: [push, pull_request, workflow_dispatch]
jobs:
  render:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Rebuild all SVGs and validate pinned assets
        run: python -X utf8 scripts/render_examples.py --output output/ci
      - name: Check meaningful renderer contracts
        run: python -X utf8 -m unittest discover -s tests -v
